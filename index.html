<title>Blissolic</title>
<meta name="description" content="All of Blissolic's links in one place.">
<!-- Discord (and most chat clients) paint the embed's accent bar from
     theme-color. The bone accent read as a beige stripe against a dark embed;
     the page's own near-black matches the site instead. -->
<meta name="theme-color" content="#0B0B0B">

<link rel="canonical" href="https://blissolic.xyz/">
<!-- No og:url: crawlers fall back to whatever URL was actually requested, so
     link previews stay correct on preview/tunnel hosts as well as on the live
     domain.

     og:image is now SELF-HOSTED, which it could not be before blissolic.xyz
     existed: crawlers don't resolve relative paths and don't run JS, so an
     absolute URL on a domain that didn't answer would have broken every
     preview. It pointed at the YouTube CDN for that reason, and that CDN still
     serves the OLD avatar — which is why the embed's picture stopped matching
     the site after the noir rebuild.

     assets/og.jpg is frame one of the animated avatar, padded square in the
     page's own black (the source is 500x400, so scaling it square would have
     stretched it). A GIF is a bad idea here: not every client animates one, and
     some will just show a broken thumbnail. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="blissolic.xyz">
<meta property="og:title" content="Blissolic">
<meta property="og:description" content="All of Blissolic's links in one place.">
<meta property="og:image" content="https://blissolic.xyz/assets/og.jpg">
<meta property="og:image:width" content="600">

     the visitor is still looking at the gate, but behind the avatar -->
<link rel="preload" as="image" href="assets/bats.webp" fetchpriority="low">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<!-- ?v= bumped whenever style.css changes: browsers (and the local dev server)
     hold the old stylesheet otherwise, and a redesign silently doesn't appear -->
<link rel="stylesheet" href="style.css?v=13">

<script>
/* The intro gate lives here, inline and ahead of everything, for two reasons.

   1. `gated` has to be on <html> before first paint or the staggered reveal
      would run behind the overlay and the page would be sitting there finished
      when the visitor clicks through.
   2. Dismissal must not depend on any other file. If player.js or bats.js is
      blocked, the intro still clears and the site works — it just does so in
      silence. A gate that can trap the page is a broken page.

   The click here is also what lets the music start: it is a real user gesture,
   so no browser can refuse audible playback afterwards. player.js and bats.js
   both listen for the `mp:enter` event this fires. */
(function () {
  var root = document.documentElement;
  root.classList.add("gated");

  var EVENTS = ["pointerdown", "touchstart", "keydown"];

  function enter(e) {
    /* A tap is not one event. It fires pointerdown/touchstart, and then — after
       the finger lifts — the browser synthesises mousedown/mouseup/click from
       it. Dismissing on the first of those means the synthetic click arrives
       when the gate is already going, so on a phone "tap anywhere to enter"
       could open whichever link happened to be under the finger.

       Two guards, because one is not enough on its own: swallow the touch's
       default action here so no compatibility click is generated, and keep the
       gate hit-testable while it fades (see .gate.is-leaving in style.css) so
       that anything that still gets through lands on the gate instead. */
    if (e && e.cancelable &&
        (e.type === "touchstart" || e.pointerType === "touch")) {
      e.preventDefault();
    }

    EVENTS.forEach(function (t) { window.removeEventListener(t, enter, true); });
    root.classList.remove("gated");

    var gate = document.getElementById("gate");
    if (gate) {
      gate.classList.add("is-leaving");
      setTimeout(function () { gate.hidden = true; }, 620);
    }

    window.dispatchEvent(new CustomEvent("mp:enter"));
  }

  /* passive: false because touchstart listeners on window are passive by
     default, and a passive listener's preventDefault() is ignored */
  EVENTS.forEach(function (t) {
    window.addEventListener(t, enter, { capture: true, once: true, passive: false });
  });
})();
</script>

  </nav>

  <!-- Unlike the sibling sites this plays a LOCAL file rather than a hidden
       YouTube iframe: the track is Senkhi's own and the user has the file, so
       there is no embed policy to fight, no API to be adblocked, and real
       control over the audio. preload="none" keeps the download off the wire
       until someone actually enters.

       ?v= bumped whenever the file is replaced — the filename never changes, so
       without it a browser (or the Pages CDN) keeps serving the old cut. v2 is
       the 0:39 segment; v1 was the full 1:57. -->
  <audio id="track" src="assets/notorious.mp3?v=2" preload="none" loop></audio>

  <section class="player" id="player" data-reveal style="--i:10"
           data-playing="false" data-muted="false" aria-label="Now playing">

    <div class="player__top">
      <span class="player__art">
        <img src="assets/pfp.gif" alt="" width="52" height="52" draggable="false">
      </span>

      <span class="player__meta">
        <span class="player__label">
          <span id="npLabel">Now playing</span>
          <span class="player__eq" aria-hidden="true"><i></i><i></i><i></i></span>
        </span>
        <span class="player__title">Senkhi &mdash; Notorious</span>
      </span>

      <button class="player__btn" id="ppBtn" type="button" aria-label="Play">
        <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.4v13.2L19 12z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3.1v14H8zM12.9 5H16v14h-3.1z"/></svg>
      </button>
    </div>

    <div class="player__seekwrap" id="seek" role="slider" tabindex="0"
         aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="player__track">
        <div class="player__fill" id="fill"></div>
        <span class="player__knob" id="knob" aria-hidden="true"></span>
      </div>
    </div>

    <div class="player__foot">
      <span class="player__time">
        <span id="tCur">0:00</span><span class="player__sep">/</span><span id="tDur">--:--</span>
      </span>

      <span class="player__vol">
        <button class="player__mute" id="muteBtn" type="button" aria-label="Mute">
          <svg class="ico-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M15.6 9.2a3.9 3.9 0 0 1 0 5.6"/><path d="M18 6.8a7.3 7.3 0 0 1 0 10.4"/></svg>
          <svg class="ico-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"/><path d="M16.2 9.8l4.6 4.6M20.8 9.8l-4.6 4.6"/></svg>
        </button>
        <input class="player__slider" id="vol" type="range" min="0" max="100" value="24"
               style="--vol:24" aria-label="Volume">
      </span>
    </div>
  </section>

  <footer class="foot" data-reveal style="--i:11">
    <span>blissolic.xyz</span>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- The intro. Shown to everyone: the click is what buys guaranteed audio, and
     it doubles as the page's entrance. Dismissed by the inline script in <head>. -->
<div class="gate" id="gate" role="button" tabindex="0" aria-label="Click anywhere to enter">
  <div class="gate__inner">
    <span class="gate__art">
      <img src="assets/pfp.gif" alt="" width="86" height="86" draggable="false">
      <span class="gate__ring" aria-hidden="true"></span>
    </span>
    <span class="gate__eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
    <p class="gate__title">Blissolic</p>
    <p class="gate__hint">Click anywhere to enter</p>
  </div>
</div>
